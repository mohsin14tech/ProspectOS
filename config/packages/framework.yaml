# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session:
        cookie_httponly: true
        cookie_samesite: lax
        cookie_secure: auto

    rate_limiter:
        ai_summary:
            policy: fixed_window
            limit: 10
            interval: '1 hour'
        owner_setup:
            policy: fixed_window
            limit: 5
            interval: '1 hour'
        google_oidc:
            policy: fixed_window
            limit: 10
            interval: '1 hour'

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
