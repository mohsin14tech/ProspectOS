name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository files for secrets
        run: docker run --rm -v "$PWD:/path" zricethezav/gitleaks:v8.30.1 dir --redact --no-banner /path

      - name: Scan Git history for secrets
        run: docker run --rm -v "$PWD:/path" zricethezav/gitleaks:v8.30.1 git --redact --no-banner /path

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start application stack
        run: docker compose up --build --detach

      - name: Wait for app initialization
        run: |
          for attempt in $(seq 1 60); do
            if docker compose exec -T app php bin/console about >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs app database searxng
          exit 1

      - name: Validate Composer metadata
        run: docker compose exec -T app composer validate --no-check-publish

      - name: Run test suite
        run: docker compose exec -T app composer test

      - name: Lint container and templates
        run: |
          docker compose exec -T app php bin/console lint:container
          docker compose exec -T app php bin/console lint:twig templates templates/macros

      - name: Validate database mappings and migrations
        run: |
          docker compose exec -T app php bin/console doctrine:schema:validate
          docker compose exec -T app php bin/console doctrine:migrations:status

      - name: Build production Tailwind assets
        run: docker compose exec -T app php bin/console tailwind:build --minify
