name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository files for secrets
        run: docker run --rm -v "$PWD:/path" zricethezav/gitleaks:v8.30.1 dir --redact --no-banner /path

      - name: Scan Git history for secrets
        run: docker run --rm -v "$PWD:/path" zricethezav/gitleaks:v8.30.1 git --redact --no-banner /path

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Validate Composer metadata
        run: docker run --rm -v "$PWD:/app" -w /app composer:2 composer validate --no-check-publish

      - name: Build app image and start PostgreSQL
        run: |
          docker compose build app
          docker compose up --detach database

      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 60); do
            if docker compose exec -T database pg_isready -U app -d app >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs database
          exit 1

      - name: Prepare database schema and demo fixtures
        run: docker compose run --rm --no-deps app sh -lc 'touch .env && php bin/console doctrine:migrations:migrate --no-interaction && php bin/console app:demo:seed'

      - name: Run test suite
        run: docker compose run --rm --no-deps app sh -lc 'touch .env && composer test'

      - name: Lint container and templates
        run: docker compose run --rm --no-deps app sh -lc 'touch .env && php bin/console lint:container && php bin/console lint:twig templates templates/macros'

      - name: Validate database mappings and migrations
        run: docker compose run --rm --no-deps app sh -lc 'touch .env && php bin/console doctrine:schema:validate && php bin/console doctrine:migrations:status'

      - name: Build production Tailwind assets
        run: docker compose run --rm --no-deps app sh -lc 'touch .env && APP_ENV=prod APP_SECRET=build-only php bin/console tailwind:build --minify'
